<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockfish</title>
  <link rel="icon" href="img/logo.webp">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><img src="img/logo.webp" alt=""><h1>Stockfish</h1></header>
  <div id="board"></div>
  <div id="info">
    <label>Profundidad <input id="depth" type="range" min="10" max="24" value="18"></label>
    <div id="eval">Evaluación: –</div>
    <div id="best">Mejor jugada: –</div>
    <div id="line">Línea: –</div>
  </div>
  <textarea id="pgn" placeholder="Pega aquí tu PGN o FEN"></textarea>
  <button id="load">Cargar y analizar</button>
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
