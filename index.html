<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockfish</title>
  <link rel="icon" href="img/logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2f6b4f">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><img src="img/logo.png" alt=""><h1>Stockfish</h1><span id="eval">Eval: 0.00</span></header>
  <div id="board"></div>
  <div id="status"></div>
  <div class="bar">
    <button id="new">Nueva</button>
    <button id="undo">⟲ Deshacer</button>
    <button id="hintBtn">💡 Pista</button>
    <button id="flip">⟳ Girar</button>
  </div>
  <div class="bar">
    <select id="side"><option value="w">Juego con blancas</option><option value="b">Juego con negras</option></select>
    <select id="level">
      <option value="3,200">Principiante</option>
      <option value="8,500">Club (~1500)</option>
      <option value="13,800">Fuerte (~2200)</option>
      <option value="17,1500">Maestro (~2700)</option>
      <option value="20,3000" selected>Máximo (más que Carlsen)</option>
    </select>
  </div>
  <div id="moves"></div>
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
